<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GrihSetu keeps residents, property teams, owners, and technicians connected through every maintenance update.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GrihSetu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GrihSetu | Property maintenance, connected</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F6F2EA; }
    #app-loading {
      align-items: center;
      color: #172522;
      display: flex;
      font: 600 16px system-ui, sans-serif;
      gap: 12px;
      inset: 0;
      justify-content: center;
      position: fixed;
    }
    #app-loading::before {
      animation: loading-pulse 1s ease-in-out infinite alternate;
      background: #0F4C45;
      border-radius: 50%;
      content: "";
      height: 16px;
      width: 16px;
    }
    @keyframes loading-pulse { to { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      #app-loading::before { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">Opening GrihSetu</div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
